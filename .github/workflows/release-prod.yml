# PROD release (ADR-0011, decision 5; #618). Runs when the owner merges the
# develop -> main release pull request, and by hand from main with a SHA
# (redeploy, or roll back to an earlier prod-<sha>). It never builds: it
# promotes the exact image digests DEV tested.
#   resolve  (no AWS) push: the merged release PR (base main, head develop)
#            and its head commit, the develop commit DEV ran (#618 E1 (a));
#            dispatch: the `sha` input
#   verify   (classora-gha-release-check, read-only, before any approval)
#            sha-<sha> and dev-<sha> on the same digest in all three
#            repositories, the commit is on develop, PROD exists and runs
#   deploy   (GitHub environment `production`: WAITS FOR THE OWNER'S
#            APPROVAL; classora-gha-prod) upload releases/<sha>.tgz from the
#            commit's tree to the PROD ops bucket, send classora-deploy-prod,
#            wait for deploy.sh (same exit codes and rollback as DEV), then
#            add prod-<sha> to the three images
#   tag      the annotated Git tag vYYYY.MM.DD-<sha7> on the develop commit
#            (contents: write in this job only)
# A refusal in resolve or verify is a red run with the reason in the summary
# and no approval request. Not part of ci-required. Runbook:
# _docs/runbooks/release.md.
#
# Variables (no secrets; OIDC, ADR-0012):
#   repository   AWS_ROLE_RELEASE_CHECK_ARN  bootstrap output gha_release_check_role_arn
#   production   AWS_ROLE_ARN                bootstrap output gha_role_arns.prod
#   production   OPS_BUCKET                  envs/prod output ops_bucket (changes
#                                            when PROD is re-created)
name: release-prod

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 40-hex develop commit to deploy to PROD (redeploy or roll back to an earlier prod-<sha>)
        required: true

permissions:
  contents: read

# One release at a time, never cancelled (an approval may be pending).
concurrency:
  group: release-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  DEPLOY_DOCUMENT: classora-deploy-prod

jobs:
  resolve:
    name: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve the release commit
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          refuse() {
            echo "::error::$1"
            echo "### PROD release refused (resolve): $1" >>"$GITHUB_STEP_SUMMARY"
            exit 1
          }
          [ "$GITHUB_REF" = refs/heads/main ] || refuse "release-prod runs only on main (got $GITHUB_REF)"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            sha=$INPUT_SHA
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || refuse "sha must be a 40-hex commit"
            echo "Manual release of $sha"
          else
            # The merged pull request whose merge (or squash) commit is this
            # push: base main, head develop. Its head SHA is the develop
            # commit that DEV deployed.
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" >pulls.json
            sha=$(jq -r --arg merge "$GITHUB_SHA" '
              [ .[] | select(.base.ref == "main" and .head.ref == "develop" and .merged_at != null) ]
              | (map(select(.merge_commit_sha == $merge)) + .) | .[0].head.sha // empty' pulls.json)
            [ -n "$sha" ] || refuse "$GITHUB_SHA is not the merge of a develop -> main release pull request; nothing to release"
            pr=$(jq -r --arg head "$sha" '[ .[] | select(.head.sha == $head) ][0].number' pulls.json)
            echo "Release PR #$pr: develop head $sha"
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

  verify:
    name: verify (DEV tested it, PROD exists)
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      digests: ${{ steps.images.outputs.digests }}
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC, classora-gha-release-check)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_RELEASE_CHECK_ARN }}
          aws-region: us-east-2
          mask-aws-account-id: true

      # The same digest must carry sha-<sha> (built and checked) and
      # dev-<sha> (deployed to DEV and healthy there) in every repository.
      - name: DEV tested this release
        id: images
        run: |
          set -euo pipefail
          problems=()
          digests=""
          for name in api web pgbouncer; do
            repo="classora/$name"
            built=$(aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=sha-$SHA" \
              --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
            tested=$(aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=dev-$SHA" \
              --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
            if [[ "$built" != sha256:* ]]; then
              problems+=("$repo has no sha-$SHA image (never built by deploy-dev)")
            elif [[ "$tested" != sha256:* ]]; then
              problems+=("$repo has no dev-$SHA tag (never deployed to DEV, or DEV's deploy failed)")
            elif [ "$built" != "$tested" ]; then
              problems+=("$repo: sha-$SHA and dev-$SHA are different digests")
            else
              digests="$digests $name=$built"
            fi
          done
          if [ "${#problems[@]}" -gt 0 ]; then
            {
              echo "### PROD release of \`$SHA\` refused (verify)"
              printf -- '- %s\n' "${problems[@]}"
              echo
              echo "Only a commit that DEV deployed can be promoted. No approval was requested."
            } >>"$GITHUB_STEP_SUMMARY"
            for problem in "${problems[@]}"; do echo "::error::$problem"; done
            exit 1
          fi
          echo "digests=${digests# }" >>"$GITHUB_OUTPUT"
          echo "DEV-tested digests:$digests"

      - name: The commit is on develop
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$SHA" origin/develop 2>/dev/null; then
            echo "### PROD release of \`$SHA\` refused (verify): not a commit on develop" >>"$GITHUB_STEP_SUMMARY"
            echo "::error::$SHA is not a commit on develop"
            exit 1
          fi

      # Unlike DEV, a missing PROD is red: a release was requested.
      - name: PROD exists
        run: |
          set -euo pipefail
          refuse() {
            echo "### PROD release of \`$SHA\` refused (verify): $1" >>"$GITHUB_STEP_SUMMARY"
            echo "::error::$1"
            exit 1
          }
          if ! instance=$(aws ssm get-parameter --name /classora/prod/instance_id \
            --query Parameter.Value --output text 2>/tmp/err); then
            grep -q ParameterNotFound /tmp/err && refuse "PROD does not exist; apply envs/prod first (runbook _docs/runbooks/release.md)"
            cat /tmp/err >&2
            exit 1
          fi
          state=$(aws ec2 describe-instances --instance-ids "$instance" \
            --query 'Reservations[0].Instances[0].State.Name' --output text 2>/dev/null || echo missing)
          [ "$state" = running ] || refuse "PROD is not running ($state)"
          {
            echo "### PROD release of \`$SHA\`: checks passed"
            echo "DEV tested the same digests; PROD is running. The deploy job waits for the owner's approval."
          } >>"$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy (owner approval)
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    # Required reviewer: the owner; deployment branch: main (#618).
    environment:
      name: production
      url: https://app.classora.dev
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      DIGESTS: ${{ needs.verify.outputs.digests }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Configure AWS credentials (OIDC, classora-gha-prod)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
          mask-aws-account-id: true

      # The bundle is the develop commit's tree (not main's) plus the digests
      # verify checked: the same layout deploy-dev uploads.
      - name: Upload the release bundle
        env:
          OPS_BUCKET: ${{ vars.OPS_BUCKET }}
        run: |
          set -euo pipefail
          registry="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com"
          : >images.env
          for name in api web pgbouncer; do
            digest=$(aws ecr describe-images --repository-name "classora/$name" --image-ids "imageTag=dev-$SHA" \
              --query 'imageDetails[0].imageDigest' --output text)
            if [[ " $DIGESTS " != *" $name=$digest "* ]]; then
              echo "::error::classora/$name dev-$SHA is $digest, not the digest verify checked"
              exit 1
            fi
            var=$(echo "$name" | tr '[:lower:]' '[:upper:]')_IMAGE
            echo "$var=$registry/classora/$name@$digest" >>images.env
          done
          tar -czf release.tgz images.env \
            infrastructure/host \
            infrastructure/docker/compose.data.yaml \
            infrastructure/docker/compose.app.yaml \
            infrastructure/observability
          aws s3 cp --only-show-errors release.tgz "s3://$OPS_BUCKET/releases/$SHA.tgz"

      # deploy.sh prints step lines and one JSON summary, never a secret.
      - name: Run deploy.sh through the SSM document
        run: |
          set -euo pipefail
          instance=$(aws ssm get-parameter --name /classora/prod/instance_id --query Parameter.Value --output text)
          command_id=$(aws ssm send-command --document-name "$DEPLOY_DOCUMENT" \
            --instance-ids "$instance" --parameters "sha=$SHA" \
            --comment "release-prod run $GITHUB_RUN_ID" --timeout-seconds 120 \
            --query Command.CommandId --output text)
          echo "SSM command $command_id: deploy.sh $SHA"
          status=Pending
          for _ in $(seq 1 90); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" \
              --query Status --output text 2>/dev/null || echo Pending)
            case $status in
              Pending | InProgress | Delayed) ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance" >invocation.json
          echo "::group::deploy.sh output"
          jq -r .StandardOutputContent invocation.json
          echo "::endgroup::"
          echo "::group::deploy.sh errors"
          jq -r .StandardErrorContent invocation.json
          echo "::endgroup::"
          code=$(jq -r .ResponseCode invocation.json)
          summary=$(jq -r .StandardOutputContent invocation.json | grep '^{"result"' | tail -n 1 || true)
          {
            echo "### PROD deploy of \`$SHA\`"
            echo "SSM status \`$status\`, exit code \`$code\`"
            echo '```json'
            echo "${summary:-no summary}"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          case "$status/$code" in
            Success/0) echo "Deployed $SHA to PROD" ;;
            */10) echo "::error::Migration failed: nothing switched, the previous release still serves"; exit 1 ;;
            */20) echo "::error::$SHA failed readiness: rolled back, the previous release serves"; exit 1 ;;
            */21) echo "::error::$SHA failed readiness and the rollback failed (or there was no previous release): PROD is down"; exit 1 ;;
            */30) echo "::error::Bundle, pull or database start failed: nothing changed"; exit 1 ;;
            *) echo "::error::Deploy ended with SSM status $status, exit code $code"; exit 1 ;;
          esac

      # Immutable tags: an existing prod-<sha> (a redeploy) is fine.
      - name: Add prod-<sha> in ECR
        run: |
          set -euo pipefail
          for name in api web pgbouncer; do
            repo="classora/$name"
            aws ecr batch-get-image --repository-name "$repo" --image-ids "imageTag=dev-$SHA" \
              --accepted-media-types application/vnd.oci.image.index.v1+json \
              application/vnd.docker.distribution.manifest.list.v2+json \
              application/vnd.oci.image.manifest.v1+json \
              application/vnd.docker.distribution.manifest.v2+json \
              --query 'images[0]' >image.json
            jq -j .imageManifest image.json >manifest.json
            media_type=$(jq -r .imageManifestMediaType image.json)
            if out=$(aws ecr put-image --repository-name "$repo" --image-tag "prod-$SHA" \
              --image-manifest file://manifest.json --image-manifest-media-type "$media_type" 2>&1 >/dev/null); then
              echo "$repo: prod-$SHA added"
            elif grep -q ImageAlreadyExistsException <<<"$out"; then
              echo "$repo: prod-$SHA already there"
            else
              echo "$out" >&2
              exit 1
            fi
          done

  tag:
    name: tag the release
    needs: [resolve, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The only job that can write to the repository: one annotated tag.
    permissions:
      contents: write
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Git tag vYYYY.MM.DD-<sha7> on the develop commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="v$(date -u +%Y.%m.%d)-${SHA:0:7}"
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$name" --jq '.object.sha + " " + .object.type' 2>/dev/null); then
            read -r object type <<<"$existing"
            [ "$type" = tag ] && object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object" --jq .object.sha)
            if [ "$object" = "$SHA" ]; then
              echo "$name already tags $SHA"
              exit 0
            fi
            echo "::error::$name exists and tags $object, not $SHA"
            exit 1
          fi
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$name" -f object="$SHA" -f type=commit \
            -f message="Classora PROD release $name ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" \
            --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$name" -f sha="$tag" >/dev/null
          echo "Tagged $SHA as $name"
          echo "### Release tag \`$name\` on \`$SHA\`" >>"$GITHUB_STEP_SUMMARY"
