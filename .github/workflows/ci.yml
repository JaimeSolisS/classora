# Pull request quality gates. Every check is one `make` target, so a red step
# is reproduced locally with the same command (see _docs/Full_README.md "Continuous
# integration"). Runtime versions come from the ADR-0001 pin files: Node from
# .nvmrc, Python from the apps/api pin file (read by uv), pnpm from packageManager
# (Corepack), PostgreSQL from POSTGRES_IMAGE in the integration conftest.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Push and manual runs
# get a group of their own (the run id), so they are never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      client: ${{ steps.filter.outputs.client }}
      e2e: ${{ steps.filter.outputs.e2e }}
      images: ${{ steps.filter.outputs.images }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Pull requests: compare the PR head with its merge base on the base
      # branch. Push and manual runs: run every group.
      - name: Detect changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            bash .github/scripts/changes.sh "$BASE_SHA" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"
          else
            printf 'api=true\nweb=true\nclient=true\ne2e=true\nimages=true\ninfra=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  api-lint:
    name: api-lint
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # An out-of-date apps/api/uv.lock fails instead of being rewritten.
      UV_LOCKED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: make lint-api
        run: make lint-api

  # API tests run as parallel jobs (#217): unit, migration checks, and the
  # rest of the integration layer in shards. Each test runs in exactly one of
  # them. Integration and migration tests use the runner's Docker through
  # Testcontainers (one PostgreSQL container per job); no Compose stack, no .env.
  api-unit:
    name: api-unit
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_LOCKED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Prefer the main Ubuntu mirror (#626)
        run: .github/scripts/apt-mirror.sh

      - name: Install the PDF system libraries (ADR-0015)
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core

      - name: make test-unit
        run: make test-unit

  api-migrations:
    name: api-migrations
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    # Develop runs take 17–20 min and every migration adds cases (#482).
    timeout-minutes: 35
    env:
      UV_LOCKED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: make test-migrations
        run: make test-migrations

  # The billing invariant suite (#103): randomized sequences of every ledger
  # operation, cross-operation races and the billing job walk, in its own job
  # so the integration shards don't grow. Pull requests run the fixed default
  # seeds (deterministic); pushes and manual runs add the run id as one more
  # seed, so develop explores a new sequence on every merge. A failure prints
  # the `make test-billing-invariants SEEDS=… STEPS=…` that reproduces it.
  api-billing-invariants:
    name: api-billing-invariants
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UV_LOCKED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: make test-billing-invariants
        env:
          BILLING_INVARIANT_EXTRA_SEED: ${{ github.event_name != 'pull_request' && github.run_id || '' }}
        run: make test-billing-invariants

  # The simulated-operations seed tests (#543 chain, #559): every
  # apps/api/tests/integration/test_simulation_*.py file, in its own job so the
  # seed runs each later part adds don't grow the integration shards. If this
  # job passes about 20 min, shard the glob in a follow-up; don't raise the
  # timeout.
  api-simulation:
    name: api-simulation
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_LOCKED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Prefer the main Ubuntu mirror (#626)
        run: .github/scripts/apt-mirror.sh

      - name: Install the PDF system libraries (ADR-0015)
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core

      - name: make test-simulation
        run: make test-simulation

  # `make test-integration` leaves out the migration checks (api-migrations),
  # the billing invariant suite (api-billing-invariants) and the simulation
  # seed tests (api-simulation).
  # The test files are dealt round-robin by path over the shards
  # (apps/api/tests/sharding.py); the matrix and the /5 in SHARD must match.
  api-integration:
    name: api-integration (${{ matrix.shard }}/5)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      UV_LOCKED: "1"
      SHARD: ${{ matrix.shard }}/5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Prefer the main Ubuntu mirror (#626)
        run: .github/scripts/apt-mirror.sh

      - name: Install the PDF system libraries (ADR-0015)
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core

      - name: make test-integration SHARD=K/5
        run: make test-integration SHARD="$SHARD"

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: make lint-web
        run: make lint-web

      - name: make test-web
        run: make test-web

      - name: make build-web
        run: make build-web

  web-storybook:
    name: web-storybook
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Read the Playwright version from the lockfile
        id: playwright
        run: |
          version=$(sed -n -E 's/^  playwright@([0-9][^:]*):$/\1/p' pnpm-lock.yaml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::playwright not found in pnpm-lock.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # CI only: the browser and its OS packages. On a cache hit only the OS
      # packages are installed. `make test-storybook` then finds the browser.
      - name: Prefer the main Ubuntu mirror (#626)
        run: .github/scripts/apt-mirror.sh

      - name: Install Playwright Chromium
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          corepack pnpm install --frozen-lockfile
          if [ "$CACHE_HIT" = "true" ]; then
            corepack pnpm --filter @classora/web exec playwright install-deps chromium
          else
            corepack pnpm --filter @classora/web exec playwright install --with-deps --only-shell chromium
          fi

      - name: make test-storybook
        run: make test-storybook

  # OpenAPI drift check: regenerates openapi.json and the TypeScript client
  # from the API code and fails if they differ from the committed files.
  api-client:
    name: api-client
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_LOCKED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: make check-api-client
        run: make check-api-client

  # Playwright E2E (smoke and axe) against the isolated classora-e2e Compose
  # stack, built, migrated and seeded by `make e2e` (no .env; values from
  # .env.example). On failure the traces, screenshots, HTML report and Compose
  # logs are uploaded as the `e2e-report` artifact.
  e2e:
    name: e2e
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      UV_LOCKED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(COREPACK_ENABLE_DOWNLOAD_PROMPT=0 corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # The demo step of `make e2e` runs on the host with the API dev dependencies.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      # Same version (and cache key) as web-storybook: @playwright/test in e2e/
      # is pinned to the playwright version of apps/web.
      - name: Read the Playwright version from the lockfile
        id: playwright
        run: |
          version=$(sed -n -E 's/^  playwright@([0-9][^:]*):$/\1/p' pnpm-lock.yaml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::playwright not found in pnpm-lock.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # CI only: the browser and its OS packages. On a cache hit only the OS
      # packages are installed. `make e2e` then finds the browser.
      - name: Prefer the main Ubuntu mirror (#626)
        run: .github/scripts/apt-mirror.sh

      - name: Install Playwright Chromium
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          corepack pnpm install --frozen-lockfile
          if [ "$CACHE_HIT" = "true" ]; then
            corepack pnpm --filter @classora/e2e exec playwright install-deps chromium
          else
            corepack pnpm --filter @classora/e2e exec playwright install --with-deps --only-shell chromium
          fi

      - name: make lint-e2e
        run: make lint-e2e

      - name: make e2e
        run: make e2e

      # The API image renders a PDF in es and en (ADR-0015); the image layers
      # are already in the daemon cache from `make e2e`.
      - name: make check-pdf-image
        run: make check-pdf-image

      # Failure only: Playwright traces and screenshots, the HTML report and
      # compose.log (synthetic data; .env.example placeholder values only).
      - name: Upload the E2E report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
          if-no-files-found: warn

  # The images that run on AWS (ADR-0010, #610), built natively for linux/arm64
  # on GitHub's arm64 runner (no QEMU) and checked before anything is pushed
  # (publishing is M9-07, #615): architecture, non-root API, no secrets in Env
  # or the build context, PDFs in es and en inside the arm64 API image, the
  # edge's behaviour and headers, and the Trivy scan of each image. Runs when
  # the image inputs change (changes.sh `images`), not for app-code-only PRs.
  images:
    name: images
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PLATFORM: linux/arm64
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # smoke-edge reads PRODUCTION_HEADERS with Node (no install needed).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: make build-images (linux/arm64)
        run: make build-images

      - name: make check-images
        run: make check-images

      # Same Dockerfile, built natively on this runner: the arm64 API image.
      - name: make check-pdf-image (arm64)
        run: make check-pdf-image

      - name: make smoke-edge
        run: make smoke-edge

      - name: make scan-image (api, web, pgbouncer)
        run: |
          fail=0
          for image in classora/api:local classora/web:local classora/pgbouncer:local; do
            echo "::group::scan-image $image"
            make scan-image IMAGE="$image" || fail=1
            echo "::endgroup::"
          done
          exit "$fail"

  # Infrastructure configuration checks (changes.sh `infra`). Validates every
  # observability config with its pinned image and starts nothing (#611,
  # ADR-0014), then Terraform fmt/validate for every root and shellcheck, in
  # pinned containers with no AWS credentials (#613, ADR-0011).
  infra:
    name: infra
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # check_config.py runs with uv (PyYAML only, no project).
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: make check-observability
        run: make check-observability

      - name: make check-infra
        run: make check-infra

  # Grader path (#672 D6): the root README's three commands on a machine that
  # has only Docker and GNU Make. The runner ships Python and Node, so the make
  # commands run inside a "clean room": the Docker CLI image (Compose and buildx
  # plugins; by multi-arch index digest, the tag is informational) plus make,
  # bash and curl, with the runner's Docker socket, the checkout at its own path
  # and the host network. No uv, Python, Node, pnpm or Pango is installed.
  # Pull requests run a test subset (unit tests, PostgreSQL, PgBouncer and Ryuk
  # through the socket, a Pango PDF); pushes to develop/main and manual runs run
  # the full `make test`. Not path-filtered; amd64 and arm64.
  grader-path:
    name: grader-path (${{ matrix.runner }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      CLEAN_ROOM_IMAGE: docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the clean room
        run: |
          docker run -d --name clean-room --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:$PWD" -w "$PWD" "$CLEAN_ROOM_IMAGE" sleep infinity
          docker exec clean-room apk add --no-cache make bash curl
          # Nothing but Docker, Make and the shells: no language toolchain.
          docker exec clean-room sh -c 'for tool in uv python python3 node pnpm; do
            if command -v "$tool"; then echo "unexpected: $tool" >&2; exit 1; fi; done'
          docker exec clean-room sh -c 'docker version --format "Docker {{.Server.Version}}"; docker compose version; make --version | head -n 1'

      - name: make start
        run: docker exec clean-room make start

      - name: make seed-data-english
        run: docker exec clean-room make seed-data-english

      - name: Sign in as owner / classora-sim-owner
        run: |
          code=$(docker exec clean-room curl -fsS -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:5173/api/v1/auth/login -H 'Origin: http://127.0.0.1:5173' \
            -H 'Content-Type: application/json' -d '{"username":"owner","password":"classora-sim-owner"}')
          echo "$code"
          test "$code" = 200

      - name: make test (pull request subset)
        if: github.event_name == 'pull_request'
        run: >-
          docker exec clean-room make test SHARDS=2
          PYTEST_ARGS="tests/unit tests/integration/test_runtime_role.py tests/integration/test_health_ready.py tests/integration/test_receipts_pdf.py"

      - name: make test (full)
        if: github.event_name != 'pull_request'
        run: docker exec clean-room make test

      - name: Compose logs
        if: failure()
        run: docker exec clean-room docker compose logs --no-color --tail 200 || true

      - name: Upload the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grader-path-${{ matrix.runner }}
          path: test-results/docker/
          retention-days: 7

  # Security scans (ADR-0016). Not path-filtered: a new advisory or a secret in
  # any file (documentation included) must turn every pull request red. The
  # scanner versions are pinned in the Makefile only.
  security-deps:
    name: security-deps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_LOCKED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      # pnpm audit reads pnpm-lock.yaml only; nothing is installed.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: make audit-deps
        run: make audit-deps

  security-secrets:
    name: security-secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: make scan-secrets
        run: make scan-secrets

      # Pull requests also report the PR's own commits separately.
      - name: make scan-secrets-diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: make scan-secrets-diff BASE="$BASE_SHA" HEAD="$HEAD_SHA"

  security-sast:
    name: security-sast
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: make sast
        run: make sast

  # The one required status check (repository ruleset on develop and main).
  # Path-filtered jobs may be skipped when their paths did not change; the
  # security jobs and grader-path always run, so a skipped one is a failure. `e2e`,
  # `images` and `infra` are path-filtered like the others (skipped only when
  # changes set them to false).
  ci-required:
    name: ci-required
    if: always()
    needs: [changes, api-lint, api-unit, api-migrations, api-billing-invariants, api-simulation, api-integration, web, web-storybook, api-client, e2e, images, infra, grader-path, security-deps, security-secrets, security-sast]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN_API: ${{ needs.changes.outputs.api }}
          RUN_WEB: ${{ needs.changes.outputs.web }}
          RUN_CLIENT: ${{ needs.changes.outputs.client }}
          RUN_E2E: ${{ needs.changes.outputs.e2e }}
          RUN_IMAGES: ${{ needs.changes.outputs.images }}
          RUN_INFRA: ${{ needs.changes.outputs.infra }}
          API_LINT: ${{ needs.api-lint.result }}
          API_UNIT: ${{ needs.api-unit.result }}
          API_MIGRATIONS: ${{ needs.api-migrations.result }}
          API_BILLING_INVARIANTS: ${{ needs.api-billing-invariants.result }}
          API_SIMULATION: ${{ needs.api-simulation.result }}
          # A matrix job's result is "failure" when any shard failed.
          API_INTEGRATION: ${{ needs.api-integration.result }}
          WEB: ${{ needs.web.result }}
          WEB_STORYBOOK: ${{ needs.web-storybook.result }}
          API_CLIENT: ${{ needs.api-client.result }}
          E2E: ${{ needs.e2e.result }}
          IMAGES: ${{ needs.images.result }}
          INFRA: ${{ needs.infra.result }}
          # Both architectures (matrix): "failure" when either failed.
          GRADER_PATH: ${{ needs['grader-path'].result }}
          SECURITY_DEPS: ${{ needs.security-deps.result }}
          # Index syntax, so a grep for repository-secret references stays empty.
          SECURITY_SECRETS: ${{ needs['security-secrets'].result }}
          SECURITY_SAST: ${{ needs.security-sast.result }}
        run: |
          echo "changes: $CHANGES (api=$RUN_API, web=$RUN_WEB, client=$RUN_CLIENT, e2e=$RUN_E2E, images=$RUN_IMAGES, infra=$RUN_INFRA)"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes finished with result '$CHANGES'"
            exit 1
          fi
          fail=0
          # check <job> <result> <whether the changes job turned it on, or "always">
          check() {
            echo "$1: $2"
            case "$2" in
              success) ;;
              skipped)
                if [ "$3" = "always" ]; then
                  echo "::error::$1 always runs but was skipped"
                  fail=1
                elif [ "$3" != "false" ]; then
                  echo "::error::$1 was skipped although its paths changed"
                  fail=1
                fi
                ;;
              *)
                echo "::error::$1 finished with result '$2'"
                fail=1
                ;;
            esac
          }
          check api-lint "$API_LINT" "$RUN_API"
          check api-unit "$API_UNIT" "$RUN_API"
          check api-migrations "$API_MIGRATIONS" "$RUN_API"
          check api-billing-invariants "$API_BILLING_INVARIANTS" "$RUN_API"
          check api-simulation "$API_SIMULATION" "$RUN_API"
          check api-integration "$API_INTEGRATION" "$RUN_API"
          check web "$WEB" "$RUN_WEB"
          check web-storybook "$WEB_STORYBOOK" "$RUN_WEB"
          check api-client "$API_CLIENT" "$RUN_CLIENT"
          check e2e "$E2E" "$RUN_E2E"
          check images "$IMAGES" "$RUN_IMAGES"
          check infra "$INFRA" "$RUN_INFRA"
          # Always-on jobs: "skipped" is a failure.
          check grader-path "$GRADER_PATH" always
          check security-deps "$SECURITY_DEPS" always
          check security-secrets "$SECURITY_SECRETS" always
          check security-sast "$SECURITY_SAST" always
          exit "$fail"
