; PgBouncer for API request traffic (_docs/adr/0003-database-connection-topology.md).
; Transaction pooling; the API disables asyncpg's statement cache and uses unique
; prepared-statement names. LISTEN, the worker and Alembic connect to PostgreSQL
; directly and never use this pooler.
; No credential here: the auth file is generated at container start (entrypoint.sh)
; and lists only the runtime role classora_app (#165); the owner connects directly.
; Pool sizes: measured on the t4g.small hosts (M10-04, #152, ADR-0018).
; No admin console users, stats users or TLS are configured.

[databases]
; Every database name is forwarded to the db service, as the connecting user.
* = host=db port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
; TCP only, no Unix socket.
unix_socket_dir =

auth_type = scram-sha-256
auth_file = /run/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 100
; 5 server connections per database and user (ADR-0018): each PostgreSQL
; backend kept by the pool holds about 40 MB of catalog and plan caches, and
; 10 of them pushed DEV into swap at 3x load. With 5, the API's up to 15
; checked-out connections wait briefly in PgBouncer, and its SQL p95 fell from
; 46 to 25 ms (less swapping and CPU contention).
default_pool_size = 5

; PgBouncer's own prepared-statement tracking is off (the 1.24 default is 200,
; which would hide a client misconfiguration). ADR-0003 relies on the client:
; asyncpg's statement cache off and unique statement names.
max_prepared_statements = 0

; Seconds to wait before retrying a failed server login (default 15), so the
; pool recovers quickly after PostgreSQL restarts.
server_login_retry = 2

; Logs go to stderr (docker compose logs). They never contain the password.
log_connections = 1
log_disconnections = 1
