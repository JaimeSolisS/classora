# App stack: api, worker and web (architecture §9.1,
# _docs/adr/0003-database-connection-topology.md). The data stack is compose.data.yaml.
# Locally both stacks run as one Compose project through the root compose.yaml.
# Host ports for db and pgbouncer belong ONLY in the local developer override
# (root compose.override.yaml); the api and web ports below stay here.

services:
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    # Named explicitly so the worker below runs this exact image.
    image: ${COMPOSE_PROJECT_NAME}-api
    # API settings from .env (validated at startup; see .env.example). An unset
    # variable is passed empty, which the API treats as missing or unset.
    environment:
      APP_ENV: ${APP_ENV:-}
      # The web app's origin: unsafe requests from any other Origin get 403.
      APP_ORIGIN: ${APP_ORIGIN:-}
      # Pooled: request traffic goes through PgBouncer (transaction mode).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      # Direct: Alembic (and later LISTEN) bypass PgBouncer.
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      WORKER_SHUTDOWN_TIMEOUT_SECONDS: ${WORKER_SHUTDOWN_TIMEOUT_SECONDS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    # Host port API_PORT (default 8000), on 127.0.0.1 only.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    # Lets `docker compose up --wait` (make dev) return only once the API serves requests.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  # Background jobs (Procrastinate, ADR-0003): the image built for api, with
  # another command; no build of its own, so both containers always run the
  # same image ID. Everything in this container connects directly to
  # PostgreSQL. Publishes no ports.
  worker:
    image: ${COMPOSE_PROJECT_NAME}-api
    # Built by the api service above, never pulled from a registry.
    pull_policy: never
    command: ["python", "-m", "app.worker"]
    # Same settings as the api (validated at startup; see .env.example).
    environment:
      APP_ENV: ${APP_ENV:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
      # The worker never uses the pooled URL; it is passed so the same settings
      # validate in both containers.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      WORKER_SHUTDOWN_TIMEOUT_SECONDS: ${WORKER_SHUTDOWN_TIMEOUT_SECONDS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    # Healthy while the process runs and PostgreSQL answers on the direct URL,
    # whether or not the Procrastinate schema exists yet. Before `make migrate`
    # the worker waits (logging that it needs `make migrate`) instead of
    # exiting, so `make dev` on a fresh clone still comes up healthy; it never
    # applies the schema itself and starts working once Alembic has created it.
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 5s
      timeout: 6s
      retries: 10
      start_period: 5s
    # Longer than the largest WORKER_SHUTDOWN_TIMEOUT_SECONDS (30), so Docker
    # never kills the worker before Procrastinate's own graceful timeout ends.
    stop_grace_period: 40s

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      # Read only by vite.config.ts (dev proxy for /health and /api); never reaches client code.
      API_PROXY_TARGET: http://api:8000
    # Host port WEB_PORT (default 5173), on 127.0.0.1 only.
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    # Lets `docker compose up --wait` (make dev) return only once the page is served.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(async (r) => process.exit(r.ok && (await r.text()).includes('id=\"root\"') ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
