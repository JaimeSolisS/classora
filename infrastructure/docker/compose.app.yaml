# App stack: api, worker and web (architecture §9.1,
# _docs/adr/0003-database-connection-topology.md). The data stack is compose.data.yaml.
# Locally both stacks run as one Compose project through the root compose.yaml.
# Host ports for db and pgbouncer belong ONLY in the local developer override
# (root compose.override.yaml); the api and web ports below stay here.

services:
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    # Named explicitly so the worker below runs this exact image.
    image: ${COMPOSE_PROJECT_NAME}-api
    # API settings from .env (validated at startup; see .env.example). An unset
    # variable is passed empty, which the API treats as missing or unset.
    environment:
      APP_ENV: ${APP_ENV:-}
      # The web app's origin: unsafe requests from any other Origin get 403.
      APP_ORIGIN: ${APP_ORIGIN:-}
      # Both URLs carry the least-privilege runtime role classora_app (DML
      # only, #165, ADR-0003 amendment); the owner credentials never reach
      # this container. `make migrate` creates the role and sets its password.
      # Pooled: request traffic goes through PgBouncer (transaction mode).
      DATABASE_URL: postgresql://classora_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env (see .env.example)}@pgbouncer:6432/${POSTGRES_DB}
      # Direct: the LISTEN connection bypasses PgBouncer.
      DATABASE_DIRECT_URL: postgresql://classora_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env (see .env.example)}@db:5432/${POSTGRES_DB}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      WORKER_SHUTDOWN_TIMEOUT_SECONDS: ${WORKER_SHUTDOWN_TIMEOUT_SECONDS:-}
      SCHEDULING_HORIZON_WEEKS: ${SCHEDULING_HORIZON_WEEKS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Empty: the default, 600 requests per minute per client IP (#163).
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-}
      # Empty: telemetry off (ADR-0014, #612). `make dev-observability` sets it.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    # Host port API_PORT (default 8000), on 127.0.0.1 only.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    # Lets `docker compose up --wait` (make dev) return only once the API serves requests.
    # start_period 180s (#660): on a slow or busy machine (a grader's laptop)
    # uvicorn can take minutes to serve; failed checks in that window don't
    # count, and the first passing check marks it healthy at once, so a fast
    # machine sees no delay. A crash still fails `make dev` at once.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 180s

  # Background jobs (Procrastinate, ADR-0003): the image built for api, with
  # another command; no build of its own, so both containers always run the
  # same image ID. Everything in this container connects directly to
  # PostgreSQL. Publishes no ports.
  worker:
    image: ${COMPOSE_PROJECT_NAME}-api
    # Built by the api service above, never pulled from a registry.
    pull_policy: never
    command: ["python", "-m", "app.worker"]
    # Same settings as the api (validated at startup; see .env.example).
    environment:
      APP_ENV: ${APP_ENV:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
      # The worker never uses the pooled URL; it is passed so the same settings
      # validate in both containers. Both carry the runtime role classora_app.
      DATABASE_URL: postgresql://classora_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env (see .env.example)}@pgbouncer:6432/${POSTGRES_DB}
      DATABASE_DIRECT_URL: postgresql://classora_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env (see .env.example)}@db:5432/${POSTGRES_DB}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      WORKER_SHUTDOWN_TIMEOUT_SECONDS: ${WORKER_SHUTDOWN_TIMEOUT_SECONDS:-}
      SCHEDULING_HORIZON_WEEKS: ${SCHEDULING_HORIZON_WEEKS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Empty: telemetry off (ADR-0014, #612). `make dev-observability` sets it.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    # Healthy while the process runs and PostgreSQL answers on the direct URL,
    # whether or not the Procrastinate schema exists yet. It never applies the
    # schema itself. On a fresh volume the role classora_app does not exist
    # (or cannot log in) until `make migrate` has run, so run `make migrate`
    # before `make dev` (#165); `make dev` prints that hint when it fails.
    # Each check starts Python and imports the whole app (about 2.5 CPU-s,
    # ADR-0018): on a slow or busy machine (a grader's laptop) one check took
    # 17-60 s, so with a 6 s timeout the worker could never turn healthy
    # (#660). Locally: a 30 s timeout, a check every 10 s, and a 180 s start
    # period whose failures don't count; the first passing check marks it
    # healthy at once (about 10 s on a fast machine). A worker that runs but
    # never reaches PostgreSQL is unhealthy after at most
    # 180 + 5 x (10 + 30) = 380 s; a configuration error exits at once.
    # The AWS hosts pin their own values (infrastructure/host/compose.aws.yaml).
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 180s
    # Longer than the largest WORKER_SHUTDOWN_TIMEOUT_SECONDS (30), so Docker
    # never kills the worker before Procrastinate's own graceful timeout ends.
    stop_grace_period: 40s

  # Tools (#165, ADR-0003 amendment): Alembic, `python -m app.cli
  # sync-runtime-role`, the seeds and the operator CLI, as the database OWNER
  # over DATABASE_MIGRATION_URL. The api image with another command; profile
  # `tools`, so `up` never starts it: `make migrate`, `make seed`,
  # `make bootstrap-owner` and the hosts' deploy run it with `run --rm`.
  # Publishes no ports.
  migrate:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    image: ${COMPOSE_PROJECT_NAME}-api
    profiles: [tools]
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: ${APP_ENV:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
      # The runtime URLs: sync-runtime-role reads classora_app's password from
      # the direct one; the settings validate as in the api.
      DATABASE_URL: postgresql://classora_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env (see .env.example)}@pgbouncer:6432/${POSTGRES_DB}
      DATABASE_DIRECT_URL: postgresql://classora_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env (see .env.example)}@db:5432/${POSTGRES_DB}
      # The owner, direct (never through PgBouncer): DDL, grants, seeds.
      DATABASE_MIGRATION_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      WORKER_SHUTDOWN_TIMEOUT_SECONDS: ${WORKER_SHUTDOWN_TIMEOUT_SECONDS:-}
      SCHEDULING_HORIZON_WEEKS: ${SCHEDULING_HORIZON_WEEKS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      # Read only by vite.config.ts (dev proxy for /health and /api); never reaches client code.
      API_PROXY_TARGET: http://api:8000
    # Host port WEB_PORT (default 5173), on 127.0.0.1 only.
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    # Lets `docker compose up --wait` (make dev) return only once the page is served.
    # start_period 180s (#660): a slow or busy machine can take minutes to
    # start Vite; the first passing check marks it healthy at once, so a fast
    # machine sees no delay.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(async (r) => process.exit(r.ok && (await r.text()).includes('id=\"root\"') ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 180s
    depends_on:
      api:
        condition: service_healthy
