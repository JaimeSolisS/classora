; Grafana settings for the monitoring stack (ADR-0014), the same locally and on
; the monitoring host (M9-09, #617). What differs per host comes from the
; environment in compose.observability.yaml: the admin password
; (GF_SECURITY_ADMIN_PASSWORD), the root URL and, on AWS, SMTP.

[security]
; Login always required. The admin password is set from the environment on the
; first start only (it lives in the grafana-data volume afterwards).
admin_user = admin
disable_initial_admin_creation = false
; Grafana's brute-force login lockout stays on (the default, stated here).
disable_brute_force_login_protection = false
cookie_samesite = strict

[auth]
disable_login_form = false

[auth.anonymous]
enabled = false

[users]
allow_sign_up = false
allow_org_create = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[log]
mode = console
level = warn

[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/host-and-containers.json
