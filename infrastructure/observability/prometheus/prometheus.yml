# Prometheus for the monitoring stack (ADR-0014): metrics arrive over OTLP from
# the Collector (gateway on the monitoring host, local.yaml in the local
# profile), started with --web.enable-otlp-receiver. Retention is a command-line
# flag (compose.observability.yaml, PROMETHEUS_RETENTION, default 15d).
# The same file runs locally and on the monitoring host (M9-09, #617).

global:
  scrape_interval: 30s
  evaluation_interval: 30s

# OTLP resource attributes become target_info only, unless promoted here to a
# label on every series. Kept to low-cardinality attributes the dashboards
# filter by (job and instance already come from service.name and
# service.instance.id).
otlp:
  promote_resource_attributes:
    - deployment.environment.name
    - host.name
    - container.name
    - container.image.name
    - postgresql.database.name

storage:
  tsdb:
    # OTLP pushes may arrive slightly out of order (batching, retries).
    out_of_order_time_window: 10m

# The stack's own health.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
