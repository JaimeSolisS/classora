# OpenTelemetry Collector (contrib) agent for the AWS app hosts (DEV, PROD),
# run in the app stack's Compose profile `telemetry` (ADR-0014; M9-06, #614).
# It collects on the host and forwards everything to the monitoring gateway.
# Locally it doesn't run: collector/local.yaml uses the same receivers (minus
# file_log, file_log/host and host_metrics) and `make check-observability`
# fails if they drift.
#
# Environment (set by M9-06 from Parameter Store, ADR-0012):
#   OTLP_GATEWAY_ENDPOINT    the gateway, e.g. http://<private IP>:4318
#                            (/classora/shared/otlp_endpoint). Without it the
#                            agent is not started at all.
#   DEPLOYMENT_ENVIRONMENT   dev or prod (deployment.environment.name)
#   PG_MONITOR_USER          the classora_monitor role: pg_monitor, plus SELECT on
#   PG_MONITOR_PASSWORD      procrastinate_jobs and procrastinate_events (sql_query)
#   PG_MONITOR_DATABASE      the application database
# The Docker daemon must log with `"log-opts": {"labels": "com.docker.compose.service"}`
# so that each json-file line carries the Compose service name (file_log below).

receivers:
  # The API and worker export here (OTEL_EXPORTER_OTLP_ENDPOINT, M9-04).
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

  # Container stdout/stderr from Docker's json-file driver (Caddy, PostgreSQL,
  # PgBouncer, the backup result lines). Needs /var/lib/docker/containers
  # mounted read-only. The API and worker logs arrive over OTLP as well once
  # M9-04 is on; their stdout copy is kept for when telemetry is off.
  file_log:
    include: [/var/lib/docker/containers/*/*-json.log]
    include_file_path: true
    start_at: end
    operators:
      # {"log": "...", "stream": "stdout", "time": "...", "attrs": {...}}
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          layout_type: gotime
          layout: "2006-01-02T15:04:05.999999999Z07:00"
      - type: move
        from: attributes.log
        to: body
      - type: regex_parser
        parse_from: attributes["log.file.path"]
        regex: '^/var/lib/docker/containers/(?P<container_id>[0-9a-f]{64})/'
      - type: move
        from: attributes.container_id
        to: resource["container.id"]
      # Container-name enrichment: the Compose service name (api, worker, db,
      # pgbouncer, web, ...) that the daemon's log-opts label adds to "attrs".
      - type: move
        if: 'attributes.attrs != nil and attributes.attrs["com.docker.compose.service"] != nil'
        from: attributes.attrs["com.docker.compose.service"]
        to: resource["container.name"]
      - type: remove
        if: "attributes.attrs != nil"
        field: attributes.attrs
      - type: remove
        field: attributes.time

  # The host's own JSON-line logs, /var/log/classora/<job>.log (M9-09, #617):
  # the backup results (backup.log, #616), read through the read-only /hostfs
  # mount. service.name is the file name without .log (`backup`), which Loki
  # indexes as service_name; the line stays the body (the backup alert rules
  # parse it with `| json`). Only new lines: history is never replayed.
  file_log/host:
    include: [/hostfs/var/log/classora/*.log]
    include_file_name: true
    start_at: end
    operators:
      - type: regex_parser
        parse_from: attributes["log.file.name"]
        regex: '^(?P<job>[a-z0-9-]+)\.log$'
      - type: move
        from: attributes.job
        to: resource["service.name"]

  # Host CPU, memory, disk and network. Needs the host's / mounted read-only
  # at /hostfs.
  host_metrics:
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      load: {}
      disk: {}
      network: {}
      filesystem:
        exclude_fs_types:
          match_type: strict
          fs_types: [autofs, binfmt_misc, cgroup2, debugfs, devpts, nsfs, overlay, proc, squashfs, sysfs, tmpfs, tracefs]
        metrics:
          system.filesystem.utilization:
            enabled: true

  # Per-container CPU and memory. Needs /var/run/docker.sock mounted read-only.
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    collection_interval: 30s
    # Empty: negotiate the API version with the daemon (the receiver's default,
    # 1.44, is refused by Docker 24 and older).
    api_version: ""

  # PostgreSQL connections, sizes, commits and rollbacks, over a direct
  # connection to the db container (never PgBouncer).
  postgresql:
    endpoint: db:5432
    transport: tcp
    username: ${env:PG_MONITOR_USER}
    password: ${env:PG_MONITOR_PASSWORD}
    databases: ["${env:PG_MONITOR_DATABASE}"]
    collection_interval: 30s
    tls:
      insecure: true

  # Readiness from inside the host network (the edge returns 404 for /health/*).
  http_check:
    collection_interval: 30s
    targets:
      - endpoint: http://api:8000/health/ready
        method: GET

  # Procrastinate queue state, read from PostgreSQL (no queue code in the app).
  # Every query returns one row per series even when the count is 0, so the
  # series never disappear.
  sql_query:
    driver: postgres
    datasource: "host=db port=5432 user=${env:PG_MONITOR_USER} password=${env:PG_MONITOR_PASSWORD} dbname=${env:PG_MONITOR_DATABASE} sslmode=disable connect_timeout=5"
    collection_interval: 60s
    queries:
      # Jobs by status (todo, doing, succeeded, failed, cancelled, aborted).
      - sql: >-
          SELECT s.status::text AS status, count(j.id) AS jobs
          FROM unnest(enum_range(NULL::procrastinate_job_status)) AS s(status)
          LEFT JOIN procrastinate_jobs AS j ON j.status = s.status
          WHERE s.status <> 'aborting'
          GROUP BY s.status
        metrics:
          - metric_name: classora.procrastinate.jobs
            value_column: jobs
            attribute_columns: [status]
            data_type: gauge
            value_type: int
      # Jobs that ended as failed or aborted in the last hour.
      - sql: >-
          SELECT t.outcome::text AS outcome, count(e.id) AS jobs
          FROM unnest(ARRAY['failed', 'aborted']::procrastinate_job_event_type[]) AS t(outcome)
          LEFT JOIN procrastinate_events AS e
            ON e.type = t.outcome AND e.at > now() - interval '1 hour'
          GROUP BY t.outcome
        metrics:
          - metric_name: classora.procrastinate.jobs.ended_last_hour
            value_column: jobs
            attribute_columns: [outcome]
            data_type: gauge
            value_type: int
      # Jobs `doing` for over 30 minutes (stalled), measured from their last
      # `started` event (procrastinate_jobs has no start time of its own).
      - sql: >-
          SELECT count(*) AS jobs
          FROM procrastinate_jobs AS j
          WHERE j.status = 'doing'
            AND (SELECT max(e.at) FROM procrastinate_events AS e
                 WHERE e.job_id = j.id AND e.type = 'started') < now() - interval '30 minutes'
        metrics:
          - metric_name: classora.procrastinate.jobs.stalled
            value_column: jobs
            data_type: gauge
            value_type: int

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  # host.name and os.type from the host.
  resource_detection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
  resource:
    attributes:
      - key: deployment.environment.name
        value: ${env:DEPLOYMENT_ENVIRONMENT}
        action: upsert
  batch: {}

exporters:
  otlp_http:
    endpoint: ${env:OTLP_GATEWAY_ENDPOINT}
    compression: gzip

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    metrics:
      receivers: [otlp, host_metrics, docker_stats, postgresql, http_check, sql_query]
      processors: [memory_limiter, resource_detection, resource, batch]
      exporters: [otlp_http]
    logs:
      receivers: [otlp, file_log, file_log/host]
      processors: [memory_limiter, resource_detection, resource, batch]
      exporters: [otlp_http]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, resource, batch]
      exporters: [otlp_http]
