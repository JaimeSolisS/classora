#cloud-config
# Cloud-init for a Classora app host (ADR-0010, #614), rendered by Terraform
# (modules/app_host/cloud_init.tf); also for the monitoring host
# (modules/monitoring_host/cloud_init.tf, its own scripts and host-setup.sh). It holds no secret (ADR-0012): only the
# host settings (environment, region, ops bucket, data volume ID), the host
# scripts needed before the first release and the systemd units, each as a
# JSON string (a YAML double-quoted scalar: plain text, so the gzipped user
# data stays well under EC2's 16 KiB limit). host-setup.sh does the rest:
# swap file, Docker and the pinned Compose plugin, the data volume, the units.
# Runs once per instance; a replaced instance runs it again.
write_files:
  - path: /etc/classora/host.env
    permissions: "0644"
    encoding: b64
    content: ${host_env}
%{ for path, file in files ~}
  - path: ${path}
    permissions: "${file.permissions}"
    content: ${jsonencode(file.content)}
%{ endfor ~}

runcmd:
  - [/opt/classora/bin/host-setup.sh]
