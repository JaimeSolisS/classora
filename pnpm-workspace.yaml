packages:
  - apps/web
  - packages/api-client

# Fail `pnpm install` when the running Node does not match engines.node in the
# root package.json (Node 24, pin set by _docs/adr/0001-runtime-version-pins.md, accepted).
engineStrict: true

# Dependency install scripts stay off unless listed here. esbuild (pulled in by
# Storybook) works without its postinstall, which only re-checks the binary
# that its platform package already ships.
allowBuilds:
  esbuild: false
