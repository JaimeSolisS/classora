# gitleaks configuration for `make scan-secrets` and `make scan-secrets-diff`
# (ADR-0016). It keeps every default rule and only adds narrow exceptions.
#
# Each allowlist entry is scoped to one rule AND one path AND the exact match, and
# carries a reason. History fixes may be scoped by commit instead. New entries are
# approved in the pull request that adds them. A new fake value in a future commit
# can also use an inline `gitleaks:allow` comment on its line, with a reason.

title = "Classora gitleaks configuration"

[extend]
useDefault = true

# Fake database passwords in the job-configuration unit test (M1-16, commit b214bf2).
# They exist to prove that real credentials are never logged; they are not secrets.
[[allowlists]]
description = "Fake DSN passwords in the job-rules unit test"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^apps/api/tests/unit/test_job_rules\.py$''']
regexTarget = "match"
regexes = ['''^(POOLED|DIRECT)_PASSWORD = "(Pooled|Direct)-S3cret-pw-4[12]"$''']

# Fake invitation token in the /invite page unit test (M2-11, #29). It is a
# placeholder fragment value; real tokens are random and never committed.
[[allowlists]]
description = "Fake invitation token in the invite page unit test"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^apps/web/src/features/auth/redeem/invite\.test\.tsx$''']
regexTarget = "match"
regexes = ['''AbCdEfGhIjKlMnOpXyStUvWxYz0123456789-_AbCdE''']

# A false positive on a code line in the password-change route (M2-12, #30,
# commit c4ac01a): `result.token, max_age=result.limits.absolute` reads as a
# key/value pair. The line was reshaped in the next commit; this entry keeps
# the branch history scannable. No secret is involved.
[[allowlists]]
description = "Session-cookie call in the password-change route (code, not a secret)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^apps/api/app/modules/identity/router\.py$''']
regexTarget = "match"
regexes = ['''token, max_age=result\.limits\.absolute''']
