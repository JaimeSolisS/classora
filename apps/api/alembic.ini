# Alembic configuration for the Classora API (spec §10: migration-first).
#
# No database URL or credential lives here: migrations/env.py reads
# DATABASE_URL through app.core.config.get_settings(). Alembic connects
# directly to PostgreSQL, never through PgBouncer (ADR-0003).
#
# Run from apps/api (locally through `make migrate`, which runs
# `alembic upgrade head` in the api image on the Compose network).
#
# Revision convention: sequential four-digit revision IDs and one linear
# history (a test asserts a single head). Create the next revision with
#   alembic revision --rev-id 0002 -m "short description"
# which writes migrations/versions/0002_short_description.py.

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

# WARNING: SQL statements and parameters are not logged.
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
