# tutors hold no permission for it). The matrix sends an invalid kind, so
# every signed-in role gets the schema's 422 first (C2 order: 422 before
# 403). The 200 and 403 cases are tested in
# tests/integration/test_evaluations.py.
query = { kind = "matrix" }

[[route]]
method = "POST"
path = "/api/v1/evaluation-templates"
access = "permission"
permission = "evaluation.manage"
allow = ["owner", "administrator", "academic_coordinator"]
# #80 C1: an empty body gets 422 for the allowed roles: nothing is created.
json = {}

[[route]]
method = "GET"
path = "/api/v1/evaluation-templates/{template_id}"
access = "authenticated"
# #80 C2: as the list (403 permission_denied for callers without
# evaluation.manage or the tutor role, before the 404). The matrix sends a
# non-UUID id, so every signed-in role gets the schema's 422 first. The 200,
# 403 and 404 cases are tested in tests/integration/test_evaluations.py.
path_params = { template_id = "matrix" }

[[route]]
method = "PUT"
path = "/api/v1/evaluation-templates/{template_id}"
access = "permission"
permission = "evaluation.manage"
allow = ["owner", "administrator", "academic_coordinator"]
# #80 C1: an empty body gets 422 for the allowed roles: nothing changes.
json = {}

[[route]]
method = "POST"
path = "/api/v1/evaluations"
access = "authenticated"
# #80 D2: the record policy (a tutor currently teaching the student; a
# reviewer 403 evaluation_tutor_only after the 404). A valid body; the
# placeholder student is unknown: 404 for every role. The 201, 403, 409 and
# 422 cases are tested in tests/integration/test_evaluations.py.
json = { student_id = "00000000-0000-4000-8000-000000000080", template_id = "00000000-0000-4000-8000-000000000081" }

[[route]]
method = "DELETE"
path = "/api/v1/evaluations/{evaluation_id}"
access = "authenticated"
# #80 D7: the evaluation record policy (the author). The placeholder id is
# no evaluation: 404 for every role. The 204, 403 and 409 cases are tested in
# tests/integration/test_evaluations.py.
query = { version = "1" }

[[route]]
method = "GET"
path = "/api/v1/evaluations/{evaluation_id}"
access = "authenticated"
# #80 D8: the evaluation record policy. The placeholder id is no evaluation:
# 404 for every role.

[[route]]
method = "PATCH"
path = "/api/v1/evaluations/{evaluation_id}"
access = "authenticated"
# #80 D4: as DELETE, with a valid body.
json = { version = 1 }

[[route]]
method = "POST"
path = "/api/v1/evaluations/{evaluation_id}/finalize"
access = "authenticated"
# #80 D5: as DELETE, with a valid body.
json = { version = 1 }

[[route]]
method = "POST"
path = "/api/v1/evaluations/{evaluation_id}/void"
access = "authenticated"
# #80 D6: the record policy, then 403 permission_denied without
# evaluation.manage (after the 404: a hidden evaluation stays hidden). The
# placeholder id is no evaluation: 404 for every role. The 200, 403 and 409
# cases are tested in tests/integration/test_evaluations.py.
json = { version = 1, reason = "Matrix" }

