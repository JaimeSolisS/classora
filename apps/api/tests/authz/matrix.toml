# Course cohorts (#65).
[[route]]
method = "GET"
path = "/api/v1/cohorts"
access = "authenticated"
# #66 G2/I2: record policy; course.view holders see every cohort, an
# enrolled student and their linked guardians (an adult's only with the
# consent, #246 E1) only their cohorts (no enrolled count), the tutor of a
# producing series their cohorts (#246 A2), anyone else an empty list (200).
# Tested in tests/integration/test_group_cohort_family_tutor_reads.py.

[[route]]
method = "POST"
path = "/api/v1/cohorts"
access = "permission"
permission = "schedule.manage"
allow = ["owner", "administrator"]
# #65 H2: a valid body with an unknown template: 422 (template_unknown) for
# every allowed role ("not denied"); nothing is created. The 201, 409 and
# other 422 cases are tested in tests/integration/test_course_cohorts_create.py.
json = { name = "Matriz 65", template_id = "00000000-0000-4000-8000-000000000065", subject_id = "00000000-0000-4000-8000-000000000065", max_students = 12, starts_on = "2031-01-06", start_time = "17:00", recurrence = { weekdays = [1, 3], interval = 1 } }

[[route]]
