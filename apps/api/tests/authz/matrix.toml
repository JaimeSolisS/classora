# Permission matrix (M2-03): every API route and who may call it.
#
# Read by tests/authz/harness.py with the standard-library tomllib.
# - tests/unit/test_permission_matrix_static.py checks it against the routes of
#   build_app(include_dev_routes=True): every route has exactly one entry and
#   one access rule, and they agree.
# - tests/integration/test_permission_matrix.py sends one request per entry and
#   role (plus anonymous, plus a delegated Administrator for delegable
#   permissions) and checks the outcome.
#
# Adding an entry: one [[route]] table per method and path template (as FastAPI
# writes it, for example "/api/v1/users/{user_id}"). Keep the entries sorted by
# path, then method (a test enforces it).
#
#   access = "public"         needs `reason` (why anyone may call it).
#   access = "authenticated"  any signed-in user; anonymous gets 401.
#   access = "permission"     needs `permission` (a catalog code, the one the
#                             route's require() names) and `allow` (role
#                             codes). Every other role gets 403
#                             permission_denied, anonymous gets 401.
#   Optional: `path_params` (values for the path template; default: a fixed
#   UUID, or 1 for an int parameter) and `json` (a request body).
#
# Reauthentication (#26, ADR-0007 D10; actions and bound permissions in
# apps/api/app/core/reauth.py):
#   reauth = "<action code>"   the route carries require_recent_auth(<code>)
#                              or recent_auth_guard(<code>); must match the
#                              route's marker. Only on POST/PUT/PATCH/DELETE,
#                              never on a public route.
#   reauth_conditional = true  the route uses recent_auth_guard (the check
#                              depends on the body; default false). Only the
#                              static check covers it; the owning issue tests
#                              its condition.
#   For an unconditional entry the runtime check reauthenticates the allowed
#   roles before the request, and adds a `reauth:none` case (an allowed role
#   without reauthentication) that expects 403 reauth_required. An unsafe
#   route requiring a bound permission (for example
#   user.password_reset.issue) must carry the marker.
#
# Rate limits (#27, ADR-0008 D15; policies in apps/api/app/core/ratelimit.py):
#   rate_limit = ["<policy>", ...]  the codes of the route's rate_limit(...)
#                                   marker (order ignored); must match it, and
#                                   the route passes RATE_LIMIT_RESPONSES (429).
#   rate_limit_exempt = "<reason>"  why an unsafe public route has no limit.
#   Every POST/PUT/PATCH/DELETE public route needs one of the two (never
#   both). A policy that no route applies must be listed in PENDING_POLICIES
#   (app/core/ratelimit.py); the issue that applies it removes it there. The
#   runtime check sends no rate-limit cases (integration tests cover them).
#
# Privacy notice (#174; spec §9): every signed-in route answers 403
# privacy_notice_required until the user accepts the current notice version,
# except the notice-exempt ones:
#   notice_exempt = true   the route is authenticated(notice_exempt=True);
#                          must match the route's AccessRule. Only for
#                          access = "authenticated" (require() has no
#                          exemption). Today exactly GET /auth/me,
#                          POST /auth/logout and the two /privacy-notice
#                          routes; adding one is a reviewed change.
#   The runtime check adds a `notice:pending` case per authenticated or
#   permission entry: an Owner who hasn't accepted the current version gets
#   403 privacy_notice_required, except on notice-exempt entries. Every other
#   actor has accepted it.
#
# The runtime check signs every role in for real (POST /api/v1/auth/login, a
# fresh session per request); anonymous sends no cookie.
#
# Example:
#
#   [[route]]
#   method = "GET"
#   path = "/api/v1/users"
#   access = "permission"
#   permission = "user.view"
#   allow = ["owner", "administrator"]

[[route]]
method = "GET"
path = "/api/v1/audit-events"
access = "permission"
permission = "audit.view"
allow = ["owner", "administrator"]

[[route]]
method = "POST"
path = "/api/v1/auth/invitation/lookup"
access = "public"
reason = "The invited person has no session yet; the one-time token is the proof (Origin check plus SameSite, #24)"
# An empty body gets 422: a well-formed unknown token would get 410 token_invalid.
json = {}
rate_limit = ["token_redemption.ip"]

[[route]]
method = "POST"
path = "/api/v1/auth/invitation/redeem"
access = "public"
reason = "The invited person has no session yet; the one-time token is the proof (Origin check plus SameSite, #24)"
# An empty body gets 422: a well-formed unknown token would get 410 token_invalid.
json = {}
rate_limit = ["token_redemption.ip"]

[[route]]
method = "POST"
path = "/api/v1/auth/login"
access = "public"
reason = "Signing in needs no session; CSRF for login is the Origin check plus SameSite (#24)"
# An empty body gets 422: a well-formed wrong login would get 401 invalid_credentials.
json = {}
rate_limit = ["login.ip", "login.username"]

[[route]]
method = "POST"
path = "/api/v1/auth/logout"
access = "authenticated"
notice_exempt = true

[[route]]
method = "GET"
path = "/api/v1/auth/me"
access = "authenticated"
notice_exempt = true

[[route]]
method = "POST"
path = "/api/v1/auth/password"
access = "authenticated"
# An empty body gets 422 for every role, so the matrix run rotates no session;
# the change itself is tested in tests/integration/test_password_change.py.
json = {}
rate_limit = ["reauth.user"]

[[route]]
method = "POST"
path = "/api/v1/auth/password-reset/lookup"
access = "public"
reason = "The person has no session; the one-time token is the proof (Origin check plus SameSite, #24)"
# An empty body gets 422: a well-formed unknown token would get 410 token_invalid.
json = {}
rate_limit = ["token_redemption.ip"]

[[route]]
method = "POST"
path = "/api/v1/auth/password-reset/redeem"
access = "public"
reason = "The person has no session; the one-time token is the proof (Origin check plus SameSite, #24)"
# An empty body gets 422: a well-formed unknown token would get 410 token_invalid.
json = {}
rate_limit = ["token_redemption.ip"]

[[route]]
method = "POST"
path = "/api/v1/auth/reauthenticate"
access = "authenticated"
# An empty body gets 422: a wrong password would get 403 reauth_failed.
json = {}
rate_limit = ["reauth.user"]

[[route]]
method = "POST"
path = "/api/v1/auth/registrations"
access = "public"
reason = "The person has no account yet; the request stays pending until staff approve it (Origin check plus SameSite, #24)"
# An empty body gets 422: nothing is written.
json = {}
rate_limit = ["registration.ip"]

[[route]]
method = "POST"
path = "/api/v1/dev/demo-jobs"
access = "public"
reason = "Local/DEV-only demo job route; never mounted outside local or dev"
json = { outcome = "succeed" }
rate_limit_exempt = "Local/DEV only; takes no credentials or tokens"

