path = "/api/v1/change-requests/{change_request_id}/reject"
access = "permission"
permission = "schedule.manage"
allow = ["owner", "administrator"]
# #62 C4: the minimal body gets 422 for every allowed role (no reason).
json = {}

[[route]]
