path = "/api/v1/education-levels"
access = "authenticated"

[[route]]
method = "POST"
path = "/api/v1/education-levels"
access = "permission"
permission = "catalog.manage"
allow = ["owner", "administrator"]
# An empty body gets 422 for the allowed roles: nothing is created.
json = {}

[[route]]
method = "GET"
path = "/api/v1/education-levels/{level_id}"
access = "authenticated"
# The placeholder id is no level: 404 for every signed-in role.

[[route]]
method = "PATCH"
path = "/api/v1/education-levels/{level_id}"
access = "permission"
permission = "catalog.manage"
allow = ["owner", "administrator"]
# An empty body (no version) gets 422 for the allowed roles.
json = {}

