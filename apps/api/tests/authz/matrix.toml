path = "/api/v1/tutors/{user_id}/availability/change-requests/{change_request_id}/cancel"
access = "permission"
permission = "tutor.view"
allow = ["owner", "administrator", "academic_coordinator", "tutor"]
# #63 D6: the tutor themselves or tutor.manage withdraw. A valid body for the
# placeholder ids, which are no tutor and no request: 404 for every allowed
