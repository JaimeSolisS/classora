rate_limit = ["token_redemption.ip"]

[[route]]
method = "POST"
path = "/api/v1/auth/password-reset/redeem"
access = "public"
reason = "The person has no session; the one-time token is the proof (Origin check plus SameSite, #24)"
# An empty body gets 422: a well-formed unknown token would get 410 token_invalid.
json = {}
rate_limit = ["token_redemption.ip"]

[[route]]
method = "POST"
path = "/api/v1/auth/reauthenticate"
access = "authenticated"
# An empty body gets 422: a wrong password would get 403 reauth_failed.
json = {}
rate_limit = ["reauth.user"]

[[route]]
method = "POST"
path = "/api/v1/auth/registrations"
access = "public"
reason = "The person has no account yet; the request stays pending until staff approve it (Origin check plus SameSite, #24)"
