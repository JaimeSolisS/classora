[[route]]
method = "POST"
path = "/api/v1/auth/password"
access = "authenticated"
# An empty body gets 422 for every role, so the matrix run rotates no session;
# the change itself is tested in tests/integration/test_password_change.py.
json = {}
rate_limit = ["reauth.user"]

[[route]]
method = "POST"
path = "/api/v1/auth/password-reset/lookup"
access = "public"
reason = "The person has no session; the one-time token is the proof (Origin check plus SameSite, #24)"
# An empty body gets 422: a well-formed unknown token would get 410 token_invalid.
