path = "/api/v1/auth/invitation/lookup"
access = "public"
reason = "The invited person has no session yet; the one-time token is the proof (Origin check plus SameSite, #24)"
# An empty body gets 422: a well-formed unknown token would get 410 token_invalid.
json = {}
rate_limit = ["token_redemption.ip"]

[[route]]
method = "POST"
path = "/api/v1/auth/invitation/redeem"
access = "public"
reason = "The invited person has no session yet; the one-time token is the proof (Origin check plus SameSite, #24)"
# An empty body gets 422: a well-formed unknown token would get 410 token_invalid.
json = {}
rate_limit = ["token_redemption.ip"]

[[route]]
method = "POST"
path = "/api/v1/auth/login"
access = "public"
reason = "Signing in needs no session; CSRF for login is the Origin check plus SameSite (#24)"
# An empty body gets 422: a well-formed wrong login would get 401 invalid_credentials.
json = {}
rate_limit = ["login.ip", "login.username"]

[[route]]
method = "POST"
path = "/api/v1/auth/logout"
access = "authenticated"
notice_exempt = true

[[route]]
