path = "/api/v1/cohorts/{cohort_id}"
access = "authenticated"
# #66 G3/I2: the placeholder id is no cohort: 404 (cohort_not_found) for
# every role. The record policy (404 for a hidden cohort) is tested in
# tests/integration/test_cohort_reads_family.py and, for tutors and the
# #246 consent rule, test_group_cohort_family_tutor_reads.py.

[[route]]
method = "PATCH"
path = "/api/v1/cohorts/{cohort_id}"
access = "permission"
permission = "schedule.manage"
allow = ["owner", "administrator"]
# #65 H2: a valid body; the placeholder id is no cohort: 404 for every
# allowed role ("not denied").
json = { version = 1, max_students = 8 }

