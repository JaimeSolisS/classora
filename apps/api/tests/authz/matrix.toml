method = "GET"
path = "/api/v1/change-requests"
access = "authenticated"
# #62 D1: lists filter (an empty page for a caller with no family or tutor role).

[[route]]
method = "POST"
path = "/api/v1/change-requests"
access = "authenticated"
# #62 B: the minimal body gets 422 for every role; the 201 and the
# record-policy outcomes are in tests/integration/test_change_requests.py.
json = {}
rate_limit = ["change_request.user"]

[[route]]
