access = "permission"
permission = "family.manage"
allow = ["owner", "administrator"]
# An empty body gets 422 for the allowed roles: nothing is linked.
json = {}

[[route]]
method = "GET"
path = "/api/v1/students/{student_id}/assignments"
access = "authenticated"
# #82 E1: assignment.review holders and tutors teaching the student (all),
# a former creator (own), the student and linked guardians with academic
# access (403 student_consent_required for a guardian of an adult without
# it); anyone else the 404 of an unknown id. The placeholder id is no
# student: 404 for every role. The leak walk is
# tests/integration/test_session_notes_leak.py.

[[route]]
method = "GET"
path = "/api/v1/students/{student_id}/assignments/{assignment_id}"
access = "authenticated"
# #82 E1: as the list; an assignment the student didn't receive is 404.

[[route]]
method = "GET"
path = "/api/v1/students/{student_id}/consents"
access = "permission"
permission = "consent.record"
allow = ["owner", "administrator", "student", "guardian"]
# The placeholder id is no student: 404 for every allowed role.

[[route]]
method = "POST"
path = "/api/v1/students/{student_id}/consents"
access = "permission"
permission = "consent.record"
allow = ["owner", "administrator", "student", "guardian"]
# A valid body for the placeholder id, which is no student: 404 for every
# allowed role (nothing is recorded).
json = { scope = "student_login", guardian_id = "00000000-0000-4000-8000-000000000001", method = "paper" }

[[route]]
method = "POST"
path = "/api/v1/students/{student_id}/consents/{consent_id}/revoke"
access = "permission"
permission = "consent.record"
allow = ["owner", "administrator", "student", "guardian"]
# The placeholder ids are no student or consent: 404 for the allowed roles.

[[route]]
method = "GET"
path = "/api/v1/students/{student_id}/evaluations"
access = "authenticated"
# #80 E1: the record policy (reviewers, tutors with the student assigned, a
# former author for their own). The placeholder id is no student: 404 for
# every role.

[[route]]
method = "POST"
path = "/api/v1/students/{student_id}/guardians"
access = "permission"
permission = "family.manage"
allow = ["owner", "administrator"]
# An empty body gets 422 for the allowed roles: nothing is linked.
json = {}

[[route]]
method = "DELETE"
path = "/api/v1/students/{student_id}/guardians/{guardian_id}"
access = "permission"
permission = "family.manage"
allow = ["owner", "administrator"]
# The placeholder ids are no link: 404 for the allowed roles.

[[route]]
method = "GET"
path = "/api/v1/students/{student_id}/learning-notes"
access = "authenticated"
# #79 F1: the family route (the student, or a linked guardian of a minor or
# of a consenting adult; anyone else, staff and tutors included, the 404 of
# an unknown id). The placeholder id is no student: 404 for every role. The
# 200 and 403 student_consent_required cases are in
# tests/integration/test_session_notes.py; the leak walk is
# tests/integration/test_session_notes_leak.py.

[[route]]
method = "GET"
path = "/api/v1/students/{student_id}/learning-plans"
access = "authenticated"
# #81 E1: holders and tutors teaching the student (every plan), a former
# creator (own plans), the student and linked guardians with academic access
# (active and closed plans; 403 student_consent_required for a guardian of
# an adult without it); anyone else the 404 of an unknown id. The
# placeholder id is no student: 404 for every role. The leak walk is
# tests/integration/test_session_notes_leak.py.

[[route]]
method = "POST"
path = "/api/v1/students/{student_id}/learning-plans"
access = "authenticated"
# #81 C3: holders and tutors teaching the student. A valid body; the
# placeholder student is unknown: 404 for every role. The 201, 403 and 422
# cases are tested in tests/integration/test_learning_plans.py.
json = { subject_id = "00000000-0000-4000-8000-000000000081", title = "Matrix", objectives = [] }

[[route]]
method = "GET"
path = "/api/v1/students/{student_id}/notes"
access = "authenticated"
# #79 E2: the record policy (reviewers, tutors with the student assigned, a
# former tutor for their own notes). The placeholder id is no student: 404
# for every role.

[[route]]
method = "GET"
path = "/api/v1/students/{student_id}/progress"
access = "authenticated"
# #84 A1, B: evaluation.manage holders, the student's current tutors, the
# student and linked guardians with academic access (403
# student_consent_required for a guardian of an adult without it); a former
# tutor and anyone else the 404 of an unknown id. The placeholder id is no
# student: 404 for every role. The 200 and 403 cases are in
# tests/integration/test_progress_dashboard.py; the leak walk is
# tests/integration/test_session_notes_leak.py.

[[route]]
method = "GET"
path = "/api/v1/students/{student_id}/progress-report-schedules"
access = "permission"
permission = "progress_report.review"
allow = ["owner", "administrator", "academic_coordinator"]
# #316 C1 (E4): staff only, checked before anything is read (families and
# tutors 403). The placeholder student is unknown: 404 for the allowed roles.

[[route]]
method = "POST"
path = "/api/v1/students/{student_id}/progress-report-schedules"
access = "permission"
permission = "progress_report.review"
allow = ["owner", "administrator", "academic_coordinator"]
# #316 C2: as GET. The 201, 409 and 422 cases are tested in
# tests/integration/test_progress_report_schedules.py.
json = { author_user_id = "00000000-0000-4000-8000-000000000316", cadence = "weekly" }

[[route]]
method = "GET"
path = "/api/v1/students/{student_id}/progress-reports"
access = "authenticated"
# #83 F1, F3: approved reports only, closed family-safe shape: holders, the
# student's current tutors, a former author (own), the student and guardians
# with academic access (403 student_consent_required for an adult's guardian
# without the consent). The placeholder id is no student: 404 for every role.

[[route]]
method = "GET"
path = "/api/v1/students/{student_id}/progress-reports/{report_id}"
access = "authenticated"
# #83 F1, F2: as the list; a report that isn't an approved report of the
# student is 404.

[[route]]
method = "GET"
path = "/api/v1/students/{student_id}/schedule"
access = "permission"
permission = "student.view"
allow = ["owner", "administrator", "academic_coordinator", "finance_staff", "tutor", "student", "guardian"]
# #67 C1: the record policy (self, a linked guardian, staff with
# schedule.view). A valid range; the placeholder id is no student: 404 for
# every allowed role. The 200 and 403 student_consent_required cases are in
# tests/integration/test_family_schedule.py.
query = { from = "2031-01-06T00:00:00Z", to = "2031-01-13T00:00:00Z" }

[[route]]
method = "GET"
path = "/api/v1/students/{student_id}/session-log"
access = "authenticated"
# #84 A1, C: as /progress, plus a former tutor (taught an in-scope session of
# the student) for the sessions they taught. The placeholder id is no
# student: 404 for every role.

