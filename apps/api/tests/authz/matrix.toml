path = "/api/v1/tutors/{user_id}/availability/exceptions/{exception_id}"
access = "permission"
permission = "tutor.view"
allow = ["owner", "administrator", "academic_coordinator", "tutor"]
# #45: the placeholder ids are no tutor and no exception: 404 for every
# allowed role.

[[route]]
