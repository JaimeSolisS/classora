path = "/api/v1/tutor-suggestions"
access = "permission"
permission = "schedule.assign"
allow = ["owner", "administrator", "academic_coordinator"]
# #51 H6: the matrix sends no query parameters (the harness has none): the
# missing subject_id/starts_at/ends_at get 422 for every allowed role ("not
# denied"). The 422 references and 200 cases are tested in
# tests/integration/test_tutor_suggestions.py.

[[route]]
method = "GET"
path = "/api/v1/tutors"
access = "permission"
permission = "tutor.view"
allow = ["owner", "administrator", "academic_coordinator", "tutor"]
# Owner decision #43 E1 (a). The record policy filters the list: a tutor
# sees only themselves.

[[route]]
method = "GET"
path = "/api/v1/tutors/{user_id}"
access = "permission"
permission = "tutor.view"
allow = ["owner", "administrator", "academic_coordinator", "tutor"]
# The placeholder id is no tutor: 404 for every allowed role.

[[route]]
method = "PATCH"
path = "/api/v1/tutors/{user_id}"
access = "permission"
permission = "tutor.view"
allow = ["owner", "administrator", "academic_coordinator", "tutor"]
# A valid body for the placeholder id, which is no tutor: 404 for every
# allowed role (nothing changes). tutor.manage is checked in the service.
json = { version = 0 }

[[route]]
method = "GET"
path = "/api/v1/tutors/{user_id}/availability"
access = "permission"
permission = "tutor.view"
allow = ["owner", "administrator", "academic_coordinator", "tutor"]
# #45: the #43 view policy. The placeholder id is no tutor: 404 for every
# allowed role.

[[route]]
method = "GET"
path = "/api/v1/tutors/{user_id}/availability/check"
access = "permission"
permission = "tutor.view"
allow = ["owner", "administrator", "academic_coordinator", "tutor"]
# #45: the matrix sends no query parameters: the missing date gets 422 for
# every allowed role ("not denied"). The 200 and 404 cases are tested in
# tests/integration/test_tutor_availability.py.

[[route]]
method = "POST"
path = "/api/v1/tutors/{user_id}/availability/exceptions"
access = "permission"
permission = "tutor.view"
allow = ["owner", "administrator", "academic_coordinator", "tutor"]
# #45: the tutor themselves or tutor.manage edit. A valid body for the
# placeholder id, which is no tutor: 404 for every allowed role.
json = { kind = "unavailable", starts_on = "2031-01-06", ends_on = "2031-01-06" }

[[route]]
