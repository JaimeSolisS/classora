# Job inventory (M10-01b, #640): every background task and how it checks the
# user it writes for, or acts as (spec §16: record-level checks in background
# jobs).
#
# Read by tests/authz/jobs.py. tests/unit/test_job_inventory.py checks it
# against the registered Procrastinate tasks (app.core.jobs.create_job_app,
# app_env "local", so the demo tasks count) and the registered notification
# types. Notifications created inside a request are out of scope: their
# recipients are computed in the actor's request, and idor.toml and the
# permission matrix cover the routes.
#
# Adding an entry: one [[task]] table per registered task name, sorted by
# name (a test enforces it). Fields:
#
#   name = "<module>:<task>"
#   kind, exactly one of:
#     "reader_checked"   the job writes output for a reader (a notification,
#                        a file, a draft) and checks that reader's
#                        authorization when it writes;
#     "actor_rechecked"  the job writes records as a user and re-checks that
#                        user's permission while it runs;
#     "no_reader_output" the job writes nothing addressed to a reader; rows
#                        it creates are read later only through routes that
#                        check access.
#   check = "<one sentence: the function and the rule>"
#       reader_checked and actor_rechecked only.
#   tests = ["tests/integration/<file>.py::<test_name>", ...]
#       reader_checked and actor_rechecked only. Node ids relative to
#       apps/api, resolved like idor.toml's (a parametrized test without its
#       [...]); they show the check stopping the output for a reader or actor
#       who lost access.
#   reason = "<why nothing is addressed to a reader>"
#       no_reader_output only.
#   notifications = ["<type>", ...]
#       Optional: the notification types the job creates (registered types
#       only).

[[task]]
name = "academics:create_progress_report_placeholders"
kind = "reader_checked"
check = "place_one re-checks under the schedule lock, through ineligible_reason, that the student is active and the author is an active tutor who currently teaches them (and the subject is active and taught); otherwise no draft and no notification"
tests = [
  "tests/integration/test_progress_report_placeholders.py::test_an_ineligible_schedule_is_skipped",
  "tests/integration/test_progress_report_placeholders.py::test_a_weekly_placeholder_for_the_week_that_ended",
]
notifications = ["academics.progress_report_due"]

[[task]]
name = "administration:run_imports"
kind = "actor_rechecked"
check = "commit_next_batch reloads the committer's principal (the registered loader, identity.service.load_principal) and re-checks kind.may_import before every batch; lost -> nothing of the batch written, the job failed, WARNING imports.commit.permission_lost"
tests = [
  "tests/integration/test_imports_pipeline.py::test_640_a_committer_who_lost_access_fails_the_job_before_the_next_batch",
  "tests/integration/test_imports_pipeline.py::test_640_another_permitted_user_resumes_as_the_new_committer",
]

[[task]]
name = "administration:run_retention"
kind = "no_reader_output"
reason = "deletes expired records (deleted academic records, finished job rows) and writes one system audit event with counts only"

