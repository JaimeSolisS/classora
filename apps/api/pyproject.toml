[project]
name = "classora-api"
version = "0.1.0"
description = "Classora FastAPI backend"
# Provisional pin (Python 3.14), pending ratification at the M1-06 / ADR-0001 decision gate.
# Keep in sync with .python-version and infrastructure/docker/api.Dockerfile.
requires-python = "==3.14.*"
dependencies = [
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
    "asyncpg>=0.32.0",
    "pydantic-settings>=2.16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "testcontainers>=4.15.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--cov=app",
    "--cov-branch",
    "--cov-report=term-missing",
]
markers = [
    "unit: fast tests with no external services (applied to tests/unit/)",
    "integration: tests against a Testcontainers PostgreSQL (applied to tests/integration/)",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
python_version = "3.14"

# asyncpg ships no py.typed marker. Narrow override; goes away when readiness
# moves to the SQLAlchemy engine (M1-07).
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
