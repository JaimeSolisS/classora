[project]
name = "classora-api"
version = "0.1.0"
description = "Classora FastAPI backend"
# Python 3.14 pin is set by _docs/adr/0001-runtime-version-pins.md (accepted).
# Keep in sync with .python-version and infrastructure/docker/api.Dockerfile.
requires-python = "==3.14.*"
dependencies = [
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
    "asyncpg>=0.32.0",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "alembic>=1.20.0",
    "procrastinate>=3.10.0,<4",
    "argon2-cffi>=25.1.0",
    "python-dateutil>=2.9.0.post0,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "testcontainers>=4.15.0",
    "pytest-cov>=7.1.0",
    "factory-boy>=3.3.3",
    "faker>=40.43.0",
    "psycopg[binary]>=3.3.6",
    "types-python-dateutil>=2.9.0.20260807",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--cov=app",
    "--cov-branch",
    "--cov-report=term-missing",
]
markers = [
    "unit: fast tests with no external services (applied to tests/unit/)",
    "integration: tests against a Testcontainers PostgreSQL (applied to tests/integration/)",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# S: flake8-bandit security rules (ADR-0016). Suppress one occurrence only with
# `# noqa: S<nnn>` and a reason on the same or the previous line.
select = ["E", "W", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: pytest checks results with plain assert statements.
# S105, S106: tests use fake, made-up credentials (DSN passwords, secrets) on purpose.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.14"

