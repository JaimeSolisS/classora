# Local development stack. Values come from .env (copy .env.example).
# The postgres:18 pin is set by _docs/adr/0001-runtime-version-pins.md (accepted).
name: classora

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    # API settings from .env (validated at startup; see .env.example). An unset
    # variable is passed empty, which the API treats as missing or unset.
    environment:
      APP_ENV: ${APP_ENV:-}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_REGION: ${STORAGE_REGION:-}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    # Lets `docker compose up --wait` (make dev) return only once the API serves requests.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      # Read only by vite.config.ts (dev proxy for /health and /api); never reaches client code.
      API_PROXY_TARGET: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    # Lets `docker compose up --wait` (make dev) return only once the page is served.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(async (r) => process.exit(r.ok && (await r.text()).includes('id=\"root\"') ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
