# Local development entry point (make dev, make migrate, plain `docker compose ...`).
# Values come from .env (copy .env.example).
#
# The services are defined in two stack files, split the way the hosts run them
# (architecture §9.1, _docs/adr/0003-database-connection-topology.md):
#   infrastructure/docker/compose.data.yaml  db, pgbouncer
#   infrastructure/docker/compose.app.yaml   api, worker, web, migrate (profile tools)
# Locally they run as ONE Compose project ("classora", same db-data volume).
# Each service here pulls its definition in with `extends:` (Compose `include:`
# needs v2.20+, and the development host runs v2.19). `extends:` keeps each
# file's settings, including depends_on inside a stack; only the dependencies
# between the stacks (api waits for pgbouncer, worker waits for db) are added
# here.
# Host ports for db and pgbouncer come only from compose.override.yaml, which
# `docker compose` loads automatically next to this file.
#
# The local observability stack (ADR-0014; otel-collector, prometheus, loki,
# tempo, grafana) comes from infrastructure/observability/compose.observability.yaml
# under Compose profile `observability`: off by default, so `make dev` and plain
# `docker compose up` never start it. `make dev-observability` does.
name: classora

services:
  db:
    extends:
      file: infrastructure/docker/compose.data.yaml
      service: db

  pgbouncer:
    extends:
      file: infrastructure/docker/compose.data.yaml
      service: pgbouncer

  api:
    extends:
      file: infrastructure/docker/compose.app.yaml
      service: api
    # API -> PgBouncer -> PostgreSQL: `docker compose up --wait` returns only
    # when the whole path is up.
    depends_on:
      pgbouncer:
        condition: service_healthy

  worker:
    extends:
      file: infrastructure/docker/compose.app.yaml
      service: worker
    # The worker connects directly to PostgreSQL (ADR-0003), never PgBouncer.
    depends_on:
      db:
        condition: service_healthy

  web:
    extends:
      file: infrastructure/docker/compose.app.yaml
      service: web

  # Tools service (#165): migrations, sync-runtime-role, seeds and the operator
  # CLI as the database owner, directly to db. Profile `tools`: only
  # `docker compose run --rm migrate ...` (make migrate/seed/bootstrap-owner).
  migrate:
    extends:
      file: infrastructure/docker/compose.app.yaml
      service: migrate
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy

  # --- Optional local observability (profile `observability`) -------------
  # One collector plays agent and gateway (collector/local.yaml): container
  # stats from the Docker socket (read-only), PostgreSQL metrics and the
  # Procrastinate queries over a direct connection as POSTGRES_USER, and the
  # API's readiness.
  otel-collector:
    extends:
      file: infrastructure/observability/compose.observability.yaml
      service: otel-collector
    profiles: [observability]
    command: ["--config=/etc/otelcol/local.yaml"]
    # Docker Desktop's socket inside containers is root-only (srwxr-xr-x
    # root:root), so docker_stats needs root here. Local only: an AWS host's
    # agent joins the socket's `docker` group instead (M9-06).
    user: "0:0"
    environment:
      PG_MONITOR_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PG_MONITOR_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PG_MONITOR_DATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  prometheus:
    extends:
      file: infrastructure/observability/compose.observability.yaml
      service: prometheus
    profiles: [observability]

  loki:
    extends:
      file: infrastructure/observability/compose.observability.yaml
      service: loki
    profiles: [observability]

  tempo:
    extends:
      file: infrastructure/observability/compose.observability.yaml
      service: tempo
    profiles: [observability]

  grafana:
    extends:
      file: infrastructure/observability/compose.observability.yaml
      service: grafana
    profiles: [observability]

volumes:
  db-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
